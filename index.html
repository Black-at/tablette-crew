<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tablette du Crew</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e90e8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* Layout: the in-game crew tablet — fixed sidebar of nav tiles + header rule with square end caps + card grid, on a hazard-striped ground. Single dark theme on purpose. */
:root{
  color-scheme:dark;
  --ground:#0a0b0d; --stripe:#141519;
  --frame:#101113; --panel:#16171a; --card:#1b1c20; --card-2:#232429; --tile:#18191d;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --fg:#eceef1; --muted:#8e939c; --dim:#5f646d;
  --accent:#1e90e8; --accent-hi:#5bb3f5; --accent-2:#1272c9; --accent-soft:rgba(30,144,232,.14); --accent-line:rgba(30,144,232,.45);
  --danger:#e5484d; --danger-soft:rgba(229,72,77,.13);
  --ok:#3fb950; --ok-soft:rgba(63,185,80,.14); --warn:#e3b341; --warn-soft:rgba(227,179,65,.14);
  --p-neg:#a78bfa; --p-sur:#e3b341; --p-braq:#f0625f; --p-poly:#3fc1a6; --p-cond:#f472b6;
  --g-patron:#e3b341; --g-copatron:#f0883e; --g-exec:#5bb3f5; --g-lieut:#3fc1a6; --g-membre:#9aa0aa;
  --font:"Poppins",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;
  background:var(--ground);
  background-image:repeating-linear-gradient(135deg,var(--stripe) 0 14px,var(--ground) 14px 28px);
  color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;background:var(--frame);border:1px solid var(--line);border-radius:8px;max-width:1500px;margin:0 auto;min-height:calc(100dvh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.55)}

/* Sidebar */
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:22px;padding:24px 22px 22px 26px;max-height:calc(100dvh - 34px);border-right:1px solid var(--line)}
.side::before,.side::after{content:"";position:absolute;right:-4px;width:7px;height:7px;background:var(--fg)}
.side::before{top:14px}.side::after{bottom:14px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:3px;background:var(--accent-soft);color:var(--accent-hi);font-size:12px;letter-spacing:.06em;font-weight:500;border:1px solid rgba(30,144,232,.25)}
.pill i{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.crew{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:24px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.crew .ic{width:22px;height:22px}
.brand-sub{display:flex;gap:9px;margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.4}
.brand-sub .ic{width:14px;height:14px;margin-top:1px}
nav{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.nav-i{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:4px;background:var(--tile);border:1px solid var(--line);color:#cfd2d8;text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap}
.nav-i:hover{background:#1e1f24}
.nav-i.on{background:linear-gradient(90deg,rgba(30,144,232,.2),rgba(30,144,232,.03));border-color:rgba(30,144,232,.25);border-left:2px solid var(--accent);color:var(--accent-hi)}
.nav-i.soon{opacity:.45;cursor:default}
.nav-i .soon-t{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.sync{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.ok b{background:var(--ok)} .sync.warn b{background:var(--warn)}
.quit{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:4px;background:linear-gradient(90deg,var(--danger-soft),transparent);border:1px solid rgba(229,72,77,.25);border-left:2px solid var(--danger);color:var(--danger)}
.quit .ic{width:18px;height:18px;margin-top:2px}
.quit strong{display:block;font-weight:600;font-size:13.5px}
.quit small{display:block;color:rgba(229,72,77,.75);font-size:10.5px}

/* Main */
.main{min-width:0;padding:22px 26px 28px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .t-ic{width:30px;height:30px}
.top h2{margin:0;font-size:21px;font-weight:700;line-height:1.2}
.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:46ch;line-height:1.3}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--card-2);border:1px solid var(--line);border-radius:4px;text-align:right}
.who strong{display:block;font-size:13px;font-weight:600}
.who small{display:block;font-size:11px;color:var(--muted)}
.who span.av{display:grid;place-items:center;width:34px;height:34px;border-radius:4px;background:#2b2c32}
.rule{position:relative;height:1px;background:var(--line-2);margin:18px 0 20px}
.rule::before,.rule::after{content:"";position:absolute;top:-3px;width:7px;height:7px;background:var(--fg)}
.rule::before{left:0}.rule::after{right:0}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:4px;background:var(--warn-soft);border:1px solid rgba(227,179,65,.3);color:#f0d27a;font-size:12.5px;margin-bottom:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:4px;border:1px solid var(--line-2);background:#2a2b31;color:#d3d6dc;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:#32333a}
.btn.pri{background:linear-gradient(180deg,#2399f0,var(--accent-2));border-color:rgba(91,179,245,.5);color:#fff;box-shadow:0 4px 14px rgba(30,144,232,.25)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#36a4f3,#1680dd)}
.btn.red{background:var(--danger-soft);border-color:rgba(229,72,77,.4);color:#ff8a8d}
.btn.ok{background:var(--ok-soft);border-color:rgba(63,185,80,.4);color:#7ee08b}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55}
.lock-b{background:#2a2b30;color:#b9bdc4;border-color:var(--line-2)}

/* Mission grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:12px}
.mcard{container-type:inline-size;background:var(--card);border:1px solid var(--line-2);border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
.mart{position:relative;height:118px;overflow:hidden;background:radial-gradient(120% 140% at 82% 0%,hsl(var(--h) 48% 34% / .95),transparent 62%),linear-gradient(160deg,hsl(var(--h) 26% 17%),#111215 78%)}
.mart::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 9px)}
.mart::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,var(--card))}
.art-ic{position:absolute;right:12%;top:6px;width:118px;height:118px;color:hsl(var(--h) 65% 78% / .5)}
.ghost-t{position:absolute;left:14px;top:10px;font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;color:rgba(255,255,255,.05);white-space:nowrap;letter-spacing:.02em}
.mcard.locked .mart{filter:grayscale(1) brightness(.72)}
.cd{position:absolute;top:12px;right:12px;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:4px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);font-size:11.5px;font-weight:500}
.cd .ic{width:12px;height:12px}
.mbody{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px 18px;padding:12px 16px 14px;margin-top:-6px;position:relative}
.mname h3{margin:0;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname p{margin:2px 0 0;font-size:12px;color:#b5b9c0}
.mname p.cool{color:var(--warn)}
.mstats{display:grid;grid-template-columns:auto auto;gap:6px 18px}
.st{display:grid;grid-template-columns:auto auto;align-items:center;gap:0 9px}
.st .ic{grid-row:span 2;width:15px;height:15px;color:#c8cbd1}
.st b{font-size:11.5px;font-weight:600;line-height:1.1;white-space:nowrap}
.st small{font-size:8.5px;letter-spacing:.06em;color:var(--muted);line-height:1.2}
@container (max-width:480px){
  .mbody{grid-template-columns:1fr auto}
  .mname{grid-column:1/-1}
}
@container (max-width:340px){
  .mbody{grid-template-columns:1fr}
  .mact .btn{width:100%}
}

/* Live OP */
.lives{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.live{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:14px 16px;border-radius:5px;background:linear-gradient(90deg,rgba(30,144,232,.12),rgba(30,144,232,.02));border:1px solid rgba(30,144,232,.3)}
.live-k{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;color:var(--accent-hi);font-weight:600}
.live-k i{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(229,72,77,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,0)}}
.live h4{margin:4px 0 2px;font-size:16px;font-weight:700;text-transform:uppercase}
.live .meta{font-size:12px;color:var(--muted)}
.live-me{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.you{grid-column:1/-1;font-size:12.5px;padding:8px 10px;border-radius:4px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.you b{color:var(--accent-hi)}

/* Chips */
.pc{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;background:#25262c;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.pc::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--dim))}
.pc small{color:var(--muted);font-size:10.5px}
.grade{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gc)}

/* Panels / generic */
.panel{background:var(--card);border:1px solid var(--line-2);border-radius:5px;padding:16px}
.panel h3{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#c9ccd2}
.panel .hint{margin:0 0 14px;color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line-2);border-radius:5px}
.empty strong{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
.seg{display:inline-flex;padding:3px;background:#141518;border:1px solid var(--line);border-radius:5px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:3px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#2b2c33;color:var(--fg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.inp{background:#121316;border:1px solid var(--line-2);border-radius:4px;padding:9px 11px;font-size:13.5px;min-width:0}
.inp:focus{border-color:var(--accent-line);outline:none}
select.inp{padding-right:8px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#c9ccd2;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line-2);border-radius:5px;padding:14px 16px}
.kpi small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:11.5px;color:var(--muted)}

/* OP history */
.opc{display:grid;grid-template-columns:6px minmax(0,1fr);background:var(--card);border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.opc .bar{background:hsl(var(--h) 55% 45%)}
.opc.fail .bar{background:var(--danger)}
.opc .in{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.op-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.op-h h4{margin:0;font-size:15px;font-weight:700;text-transform:uppercase}
.op-h .meta{font-size:12px;color:var(--muted)}
.op-h .tot{margin-left:auto;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:#7ee08b}
.opc.fail .tot{color:#ff8a8d}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.st-pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.st-pill.ok{background:var(--ok-soft);color:#7ee08b}.st-pill.fail{background:var(--danger-soft);color:#ff8a8d}.st-pill.wait{background:var(--warn-soft);color:#f0d27a}.st-pill.info{background:var(--accent-soft);color:var(--accent-hi)}

/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.lb-r .rk{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.lb-r .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.lb-r .track{height:6px;border-radius:3px;background:#24252a;overflow:hidden}
.lb-r .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent-hi));border-radius:3px}
.lb-r .v{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:#c9ccd2}
.lb-r .v small{display:block;color:var(--muted);font-size:10.5px}

/* Modal / wizard */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,6,8,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wiz{width:100%;max-width:1120px;background:var(--frame);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.7);margin:auto 0}
.wiz-h{position:relative;display:flex;align-items:flex-end;gap:16px;padding:18px 20px;min-height:100px;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(90% 160% at 85% 0%,hsl(var(--h) 48% 30% / .9),transparent 60%),linear-gradient(160deg,hsl(var(--h) 25% 15%),var(--frame) 80%)}
.wiz-h .art-ic{right:90px;top:-8px;width:120px;height:120px;opacity:.6}
.wiz-h h3{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;position:relative}
.wiz-h p{margin:2px 0 0;color:#c2c6cc;font-size:12.5px;position:relative}
.wiz-x{position:absolute;top:14px;right:14px;z-index:1}
.steps{display:flex;gap:0;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.steps button b{display:grid;place-items:center;width:20px;height:20px;border-radius:3px;background:#24252a;font-size:11px}
.steps button[aria-current="step"]{color:var(--fg);border-bottom-color:var(--accent)}
.steps button[aria-current="step"] b{background:var(--accent);color:#fff}
.steps button.done b{background:var(--ok-soft);color:#7ee08b}
.wiz-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.wiz-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 8px 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:5px}
.toolbar .lbl{font-size:12.5px;color:#c9ccd2}
.toolbar .lbl.bad{color:var(--warn)}
.grp h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gc,var(--muted));font-weight:600}
.grps{display:flex;flex-direction:column;gap:14px}
.mchip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:4px;border:1px solid var(--line-2);background:var(--tile);font-size:13px;font-weight:500}
.mchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:#fff}
.mchip .ck{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);display:grid;place-items:center}
.mchip[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.mchip .ck .ic{width:11px;height:11px;color:#fff}
.fb{display:inline-flex;gap:3px}
.fb i{font-style:normal;font-size:9.5px;font-weight:700;width:16px;height:16px;border-radius:3px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc)}

/* Postes */
.pcounts{display:flex;flex-wrap:wrap;gap:6px}
.prows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:8px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:5px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pc,var(--line-2))}
.prow .nm{flex:1;min-width:90px;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.popt{display:flex;gap:4px;flex-wrap:wrap}
.popt button{padding:6px 9px;border-radius:4px;border:1px solid var(--line);background:#141518;font-size:11.5px;color:var(--muted)}
.popt button[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 20%,transparent);border-color:color-mix(in srgb,var(--pc) 60%,transparent);color:#fff}

/* Vehicles */
.pool{min-height:54px;padding:10px;border:1px dashed var(--line-2);border-radius:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(0,0,0,.18)}
.pool.drop{border-color:var(--accent);background:var(--accent-soft)}
.pool .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.dchip{padding:6px 11px;border-radius:4px;border:1px solid var(--line-2);background:#25262c;font-size:12.5px;font-weight:500;touch-action:manipulation}
.dchip.sel,.seat.sel{outline:2px solid var(--accent-hi);outline-offset:1px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.vcard{background:var(--card);border:1px solid var(--line-2);border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:12px}
.vcard-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vcard-h strong{white-space:nowrap}
.vcard-h .seg{flex-wrap:nowrap}
.vcard-h .seg button{padding:5px 9px}
.vcard-h strong{font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.vcard-h small{color:var(--muted);font-size:11px}
.car{position:relative;width:176px;max-width:100%;margin:2px auto 4px;padding:44px 12px 34px;border-radius:44px 44px 24px 24px;background:linear-gradient(180deg,#2a2b31,#1e1f24);border:1px solid var(--line-2)}
.car.c5{width:214px}
.car::before{content:"";position:absolute;top:12px;left:24px;right:24px;height:22px;border-radius:16px 16px 4px 4px;background:rgba(30,144,232,.16);border:1px solid rgba(30,144,232,.32)}
.car::after{content:"";position:absolute;bottom:10px;left:30px;right:30px;height:14px;border-radius:3px 3px 10px 10px;background:rgba(30,144,232,.1);border:1px solid rgba(30,144,232,.22)}
.wh{position:absolute;width:7px;height:28px;border-radius:3px;background:#0d0e10;border:1px solid var(--line-2)}
.wh.a{left:-5px;top:40px}.wh.b{right:-5px;top:40px}.wh.c{left:-5px;bottom:34px}.wh.d{right:-5px;bottom:34px}
.srows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.srow.r3{grid-template-columns:repeat(3,1fr)}
.seat{min-height:60px;padding:5px 3px;border-radius:9px 9px 4px 4px;border:1px dashed var(--line-2);background:#2e2f36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.seat.full{background:var(--accent-soft);border:1px solid var(--accent-line)}
.seat.drop{border-color:var(--accent-hi);background:rgba(30,144,232,.25)}
.seat .who-s{font-size:11.5px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.seat .sl{font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seat.full .sl{color:var(--accent-hi)}

/* Bilan step */
.disc{margin:0;padding:14px 16px;border-radius:5px;background:#0d0e10;border:1px solid var(--line-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:#dcdfe4;user-select:text}
.money{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 12px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.sum small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sum b{font-size:14px;font-variant-numeric:tabular-nums}

/* Coffre */
.wheel-wrap{position:relative;width:min(100%,360px);aspect-ratio:1;margin:6px auto 4px}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--accent-hi);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:1}
.winner{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.winner .nm{font-size:28px;font-weight:800;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.items{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.item .bx{width:18px;height:18px;border-radius:4px;border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.item.done .bx{background:var(--ok);border-color:var(--ok)}
.item .bx .ic{width:12px;height:12px;color:#0b0c0e}
.item .q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.item.done .t{color:var(--muted);text-decoration:line-through}
.progress{height:6px;border-radius:3px;background:#24252a;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--ok)}
.hist{display:flex;flex-direction:column}
.hist-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.hist-r:first-child{border-top:0}
.hist-r small{color:var(--muted);font-size:11.5px}
.tgl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;border:1px solid var(--line-2);background:var(--tile);font-size:12px}
.tgl[aria-pressed="false"]{opacity:.45;text-decoration:line-through}

/* Formations */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.fcard{background:var(--card);border:1px solid var(--line-2);border-top:3px solid var(--pc);border-radius:5px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fcard-h{display:flex;gap:12px;align-items:center}
.fcard-h .fi{display:grid;place-items:center;width:38px;height:38px;border-radius:5px;background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc)}
.fcard-h .fi .ic{width:20px;height:20px}
.fcard h3{margin:0;font-size:15px;font-weight:700;text-transform:uppercase}
.fcard .fs{font-size:11.5px;color:var(--muted)}
.fcard p{margin:0;color:#c3c7cd;font-size:13px}
.prog{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.prog li{display:flex;gap:9px;font-size:12.5px;color:#c9ccd2}
.prog li .ic{width:14px;height:14px;color:var(--pc);margin-top:2px}
.wait-l{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.wait-l .r{display:flex;align-items:center;gap:8px;font-size:13px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.cell{min-width:92px;padding:5px 9px;border-radius:4px;border:1px solid var(--line);background:#141518;font-size:11.5px;color:var(--dim)}
.cell.ins{background:var(--warn-soft);border-color:rgba(227,179,65,.35);color:#f0d27a}
.cell.ok{background:var(--ok-soft);border-color:rgba(63,185,80,.35);color:#7ee08b}
.cell:disabled{cursor:default;opacity:1}

/* Identity modal */
.idm{width:100%;max-width:640px;background:var(--frame);border:1px solid var(--line-2);border-radius:8px;padding:22px;margin:auto 0;display:flex;flex-direction:column;gap:16px}
.idm h3{margin:0;font-size:18px;font-weight:700}
.idm p{margin:0;color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;padding:10px 16px;border-radius:5px;background:#24252b;border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


/* Inventaire du coffre (style inventaire en jeu) */
.inv-wrap{display:flex;flex-direction:column;gap:12px}
.inv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.inv-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:5px;background:var(--card-2);border:1px solid var(--line-2)}
.inv-ic .ic{width:20px;height:20px}
.inv-head strong{display:block;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.inv-head small{display:block;color:var(--muted);font-size:12px}
.inv-kg{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);min-width:140px}
.inv-kg b{font-size:22px;color:var(--fg)}
.kgbar{display:block;height:4px;border-radius:2px;background:#24252a;margin-top:6px;overflow:hidden}
.kgbar i{display:block;height:100%;background:var(--accent)}
.inv-search{display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line-2);border-radius:5px;background:#141518}
.inv-search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:14px;outline:none}
.inv-search:focus-within{border-color:var(--accent-line)}
.inv-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}
.inv-tabs button{padding:10px 8px;border-radius:4px;background:var(--tile);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12.5px}
.inv-tabs button[aria-pressed="true"]{background:linear-gradient(180deg,#2399f0,var(--accent-2));border-color:rgba(91,179,245,.5);color:#fff}
.inv-cols{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px;align-content:start}
.tile{position:relative;aspect-ratio:1/1.02;min-height:104px;background:linear-gradient(180deg,#202126,#17181c);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 6px 11px;text-align:center;overflow:hidden}
.tile:hover{border-color:var(--line-2);background:linear-gradient(180deg,#25262c,#1a1b20)}
.tile.sel{border-color:var(--accent-hi);box-shadow:inset 0 0 0 1px var(--accent-hi)}
.tile .tw{position:absolute;top:6px;left:7px;font-size:10.5px;font-weight:600;color:#cfd2d7}
.tile .tq{position:absolute;top:6px;right:7px;font-size:10.5px;font-weight:600;color:#eceef1}
.tile .ti{flex:1;display:grid;place-items:center;width:100%;min-height:0}
.tile .ti svg{width:46px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.tile .tn{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .tb{position:absolute;left:8px;bottom:5px;height:3px;border-radius:2px;background:var(--accent)}
.tile.low .tb{background:var(--danger)}
.tile.low{border-color:rgba(229,72,77,.35)}
.ti-big svg{width:52px;height:52px}
.inv-detail .row{flex-wrap:nowrap}
.inv-detail .row:not(:first-child){flex-wrap:wrap}
details.edit{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
details.edit summary{cursor:pointer;font-size:12.5px;color:var(--accent-hi)}
.dots{display:inline-flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(229,72,77,.6)}
.dots i.on{background:var(--danger)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0;position:relative;top:0;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px;gap:14px}
  .side::before,.side::after{display:none}
  .brand-sub{display:none}
  nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav-i{padding:9px 12px}
  .nav-i.soon{display:none}
  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .quit small{display:none}
  .quit{padding:8px 12px}
  .main{padding:18px 14px 22px}
  .cols,.inv-cols{grid-template-columns:1fr}
  .who{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function isoWeek(d){

}

/* ---------- Store (Firebase Firestore + comptes, ou mode local) ---------- */
const FB_CFG = window.FIREBASE_CONFIG || null;
const hasFB = !!(FB_CFG && FB_CFG.apiKey && !/COLLE|XXX/i.test(FB_CFG.apiKey) && window.firebase);
const Store = {
  mode:'init', db:null, q:{}, local:{}, subs:[], unsubs:[], synced:false, code:null, key:null,
  init(){
    if (hasFB) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
        this.db = firebase.firestore();
        if (FB_CFG.emulator) this.db.useEmulator('127.0.0.1', 8085);
        this.mode = 'fire';
      } catch(e) { console.error(e); this.mode = 'local'; }
    } else this.mode = 'local';
    if (this.mode === 'local') { this.local = LS.get('crew-local-db', {}); this.synced = true; }
  },
  // Chaque écriture part avec une preuve à usage unique (illisible par tous) qui contient la clé de l'auteur.
  proof(b){ const id = 'p' + rnd(22); b.set(this.db.doc(this.p('proofs/' + id)), {k: this.key || 'BOOT'}); return id; },
  p(path){ return 'crews/' + this.code + '/' + path; },
  stopAll(){ this.unsubs.forEach(u => { try { u(); } catch(e){} }); this.unsubs = []; this.subs = []; this.synced = this.mode === 'local'; },
  emitLocal(){ LS.set('crew-local-db', this.local); this.subs.forEach(s => s.fire()); },
  // opt = {order:'at', dir:'desc', limit:40} pour ne lire que les derniers documents.
  watchColl(name, cb, opt){
    if (this.mode === 'fire') {
      let q = this.db.collection(this.p(name));
      if (opt) q = q.orderBy(opt.order, opt.dir || 'asc').limit(opt.limit || 50);
      const u = q.onSnapshot(s => { if (!s.metadata.fromCache) markSynced(); cb(s.docs.map(d => Object.assign({}, d.data(), {id:d.id})).filter(d => !d._del)); }, e => syncError(e));
      this.unsubs.push(u); return u;
    }
    const depth = name.split('/').length + 1;
    const sub = {fire:() => {
      let l = Object.entries(this.local).filter(([p,v]) => p.split('/').length===depth && p.startsWith(name+'/') && !v._del).map(([p,v]) => Object.assign({}, v, {id:p.split('/').pop()}));
      if (opt) l = l.sort((a,b) => (opt.dir === 'desc' ? -1 : 1) * ((a[opt.order]||0) - (b[opt.order]||0))).slice(0, opt.limit || 50);
      cb(l);
    }};
    this.subs.push(sub); sub.fire(); return () => {};
  },
  watchDoc(path, cb){
    if (this.mode === 'fire') {
      const u = this.db.doc(this.p(path)).onSnapshot(s => { if (!s.metadata.fromCache) markSynced(); cb(s.exists ? s.data() : null); }, e => syncError(e));
      this.unsubs.push(u); return u;
    }
    const sub = {fire:() => cb(this.local[path] ? JSON.parse(JSON.stringify(this.local[path])) : null)};
    this.subs.push(sub); sub.fire(); return () => {};
  },
  async getRoot(path){ if (this.mode !== 'fire') return null; const d = await this.db.doc(path).get(); return d.exists ? d.data() : null; },
  // Retire l'identifiant interne et l'ancien champ _k (qui contenait le code de l'auteur).
  sign(data){ const d = JSON.parse(JSON.stringify(data)); delete d.id; delete d._k; return d; },
  // Écritures groupées : [{path, data, root?}] — root = chemin hors crew (keys).
  async batch(list){
    if (this.mode !== 'fire') { list.forEach(w => { if (!w.root) this.local[w.path] = this.sign(w.data); }); this.emitLocal(); return true; }
    try { const b = this.db.batch(); const pid = this.proof(b); list.forEach(w => b.set(this.db.doc(w.root ? w.path : this.p(w.path)), Object.assign(this.sign(w.data), {_p:pid}))); await b.commit(); return true; }
    catch(e) { return writeErr(e); }
  },
  write(path, data){
    // On ne supprime jamais vraiment (les règles l'interdisent) : on marque _del.
    const clean = this.sign(data === null ? {_del:true} : data);
    if (this.mode !== 'fire') { this.local[path] = clean; this.emitLocal(); return Promise.resolve(true); }
    const prev = this.q[path] || Promise.resolve();
    const run = () => { const b = this.db.batch(); const pid = this.proof(b); b.set(this.db.doc(this.p(path)), Object.assign({}, clean, {_p:pid})); return b.commit(); };
    const p = prev.catch(()=>{}).then(run).then(() => true, e => writeErr(e));
    this.q[path] = p; return p;
  },
  // Ajoute n à la quantité (dépôt / retrait), sans écraser un dépôt fait en même temps par un autre membre.
  incr(path, n, extra){
    if (this.mode !== 'fire') { const d = this.local[path]; if (d) { d.qty = (d.qty||0) + n; Object.assign(d, extra); this.emitLocal(); } return Promise.resolve(true); }
    const prev = this.q[path] || Promise.resolve();
    const run = () => { const b = this.db.batch(); const pid = this.proof(b); b.update(this.db.doc(this.p(path)), Object.assign({qty: firebase.firestore.FieldValue.increment(n)}, extra, {_p:pid})); return b.commit(); };
    const p = prev.catch(()=>{}).then(run).then(() => true, e => writeErr(e));
    this.q[path] = p; return p;
  }
};
function writeErr(e){
  const c = e && e.code;
  if (c === 'permission-denied') toast("Action refusée : ton grade ne le permet pas (ou le stock est insuffisant).");
  else if (c === 'resource-exhausted') toast("Limite gratuite du jour atteinte. Réessaie demain.");
  else toast("Enregistrement impossible pour l'instant. Vérifie ta connexion.");
  return false;
}

function ensureVehicles(w){
  if (!w.vehicles.length) { const n = Math.max(1, Math.ceil(w.participants.length/4)); for (let i=0;i<n;i++) w.vehicles.push({seats:4, slots:[null,null,null,null]}); }

function autoPostes(w){
  const n = w.participants.length; const c = {neg:0, sur:0, braq:0, poly:0};
  if (n >= 2) c.neg = 1; if (n >= 10) c.neg = 2;
  if (n >= 3) c.sur = Math.max(1, Math.round(n*0.25));
  if (n >= 6) c.poly = Math.max(1, Math.round(n*0.15));
  c.braq = n - c.neg - c.sur - c.poly;
  const pool = shuffle(w.participants.slice()); const res = {}; const need = Object.assign({}, c);
  if (w.prio) {
    for (const p of POSTES) { if (!p.form) continue;
      for (const nm of pool.slice()) { if (need[p.id] <= 0) break; if (isFormed(nm, p.form)) { res[nm] = p.id; pool.splice(pool.indexOf(nm),1); need[p.id]--; } } }
  }
  for (const p of POSTES) while (need[p.id] > 0 && pool.length) { res[pool.shift()] = p.id; need[p.id]--; }
  pool.forEach(nm => res[nm] = 'braq');
  w.postes = res;
}
function autoVehicles(w){
  ensureVehicles(w);
  const names = shuffle(w.participants.slice());
  let cap = w.vehicles.reduce((s,v) => s + v.seats, 0), added = 0;
  while (cap < names.length) { w.vehicles.push({seats:4, slots:[null,null,null,null]}); cap += 4; added++; }
  w.vehicles.forEach(v => v.slots = Array(v.seats).fill(null));
  // Les membres formés Conducteur prennent le volant en priorité.
  const drivers = names.filter(n => isFormed(n, 'cond'));
  const rest = names.slice();
  for (const v of w.vehicles) { if (!drivers.length) break; const d = drivers.shift(); v.slots[0] = d; rest.splice(rest.indexOf(d), 1); }
  for (let s=0; s<5; s++) for (const v of w.vehicles) if (s < v.seats && !v.slots[s] && rest.length) v.slots[s] = rest.shift();
  if (added) toast(`${added} véhicule${added>1?'s':''} ajouté${added>1?'s':''} pour placer tout le monde.`);
}

/* ---------- Coffre ---------- */
const thisWeek = () => isoWeek(new Date()).id;
function lastWeekDoc(){ const id = thisWeek(); return S.coffre.filter(c => c.id < id).sort((a,b) => a.id < b.id ? 1 : -1)[0]; }
function eligible(){
  const c = cfg(); const ex = new Set(c.coffreExclude || []);
  const lw = lastWeekDoc();
  return members().filter(m => !ex.has(m.id) && !(c.coffreExcludeLast && lw && lw.memberId === m.id));
}
let wheelNames = [];
function drawWheel(){
  const cv = $('#wheel'); if (!cv) return;
  const names = wheelNames;
  const dpr = window.devicePixelRatio || 1; const size = cv.clientWidth || 340;
  cv.width = size*dpr; cv.height = size*dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const r = size/2, cx = r, cy = r;
  g.clearRect(0,0,size,size);
  g.beginPath(); g.arc(cx,cy,r-2,0,Math.PI*2); g.fillStyle = '#0d0e10'; g.fill();
  const n = names.length;
  if (!n) { g.fillStyle = '#8e939c'; g.font = '500 13px Poppins, sans-serif'; g.textAlign = 'center'; g.fillText('Aucun membre éligible', cx, cy); return; }
  const a = Math.PI*2/n; const rot = S.wheelRot;
  const fills = ['#16324d','#1b1c21'];
  for (let i=0;i<n;i++){
    const s = rot + i*a;
    g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,r-8,s,s+a); g.closePath();
    g.fillStyle = (n % 2 && i === n-1 && n > 1) ? '#24344a' : fills[i % 2]; g.fill();
    g.strokeStyle = 'rgba(91,179,245,.35)'; g.lineWidth = 1; g.stroke();
    g.save(); g.translate(cx,cy); g.rotate(s + a/2); g.textAlign = 'right'; g.textBaseline = 'middle';
    g.fillStyle = '#eceef1'; g.font = `600 ${n > 12 ? 11 : 13}px Poppins, sans-serif`;
    let t = names[i]; if (t.length > 14) t = t.slice(0,13) + '…';
    g.fillText(t, r - 22, 0); g.restore();
  }
  g.beginPath(); g.arc(cx,cy,r-4,0,Math.PI*2); g.strokeStyle = '#1e90e8'; g.lineWidth = 3; g.stroke();
  for (let i=0;i<n;i++){ const s = rot + i*a; g.beginPath(); g.arc(cx + Math.cos(s)*(r-4), cy + Math.sin(s)*(r-4), 3, 0, Math.PI*2); g.fillStyle = '#5bb3f5'; g.fill(); }
  g.beginPath(); g.arc(cx,cy,30,0,Math.PI*2); g.fillStyle = '#101113'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.15)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = '#5bb3f5'; g.font = '800 11px Poppins, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('COFFRE', cx, cy);
}
function spin(){
  const el = eligible(); if (!el.length || S.spinning) return;
  wheelNames = el.map(m => m.name);
  const n = el.length, a = Math.PI*2/n, i = Math.floor(Math.random()*n);
  const jitter = (Math.random()-0.5)*a*0.6;
  const base = -Math.PI/2 - (i+0.5)*a + jitter;
  const cur = S.wheelRot; let target = base;
  while (target < cur + Math.PI*2*6) target += Math.PI*2;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 600 : 5200; const t0 = performance.now();
  S.spinning = true; const btn = $('#spin-btn'); if (btn) { btn.disabled = true; btn.textContent = 'La roue tourne…'; }
  const step = now => {
    const p = Math.min(1, (now - t0)/dur); const e = 1 - Math.pow(1-p, 4);
    S.wheelRot = cur + (target - cur)*e; drawWheel();
    if (p < 1) requestAnimationFrame(step);
    else {
      S.wheelRot = target % (Math.PI*2);
      const win = el[i]; const by = me() ? me().name : '?';
      const doc = {week: thisWeek(), memberId: win.id, member: win.name, at: Date.now(), by,
        items: (cfg().coffreItems || DEFAULT_ITEMS).map(x => ({label:x.label, qty:Number(x.qty)||0, done:false}))};
      const ix = S.coffre.findIndex(c => c.id === thisWeek());
      const local = Object.assign({}, doc, {id: thisWeek()});
      if (ix >= 0) S.coffre[ix] = local; else S.coffre.push(local);
      Store.write('coffre/' + thisWeek(), doc);
      S.spinning = false; S.confirm = null; S.pending = false;
      toast(`${win.name} remplit le coffre cette semaine.`);
      render();
    }
  };
  requestAnimationFrame(step);
}

}

const CODE_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){ const a = new Uint32Array(12); crypto.getRandomValues(a); const c = Array.from(a, x => CODE_ALPHA[x % 32]).join(''); return c.slice(0,4) + '-' + c.slice(4,8) + '-' + c.slice(8); }
const rnd = n => { const a = new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a, x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''); };
const CODE_RE = /^[A-Za-z0-9_-]{16,64}$/;
const KEY_RE = /^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$/;
const loginLink = m => location.origin + location.pathname + '#id=' + encodeURIComponent(m.name);
// Clé secrète = PBKDF2(nom + mot de passe). Seule la clé est envoyée, jamais le mot de passe.
async function deriveKey(name, pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:enc.encode('tablette-crew:' + slug(name)), iterations:120000}, base, 256);
  return 'k_' + Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
}
// Écritures pour donner un nouveau mot de passe à un membre (nouvelle clé + version suivante).
async function passwordWrites(m, pw, extraKey, memberPatch){
  const kv = (m.kv || 0) + 1;
  const id = await deriveKey(m.name, pw);
  const cur = Object.assign({}, S.mdocs.find(x => x.id === m.id) || m, {kv}, memberPatch || {});
  return {id, kv, list:[
    {root:true, path:'keys/' + id, data:Object.assign({crew:Store.code, memberId:m.id, kv}, extraKey || {})},
    {path:'members/' + m.id, data:cur}
  ]};
}
const vaultBase = () => S.myKey && S.myKey.vault ? `v/${S.myKey.vault}/codes` : null;
async function issueAccount(m){
  if (!isAdmin() || !m || !vaultBase()) return false;
  if (m.id === S.meId) return false;
  const pw = genCode();
  const r = await passwordWrites(m, pw, null, {pwChanged:false});
  r.list.push({path:`${vaultBase()}/${m.id}`, data:{password:pw, kv:r.kv}});
  const ok = await Store.batch(r.list);
  if (ok) { S.reveal[m.id] = true; render(); toast(m.kv ? `Nouveau mot de passe pour ${m.name}. L'ancien ne marche plus.` : `Mot de passe créé pour ${m.name}.`); }
  return ok;
}
function knownPw(m){ const v = S.vault[m.id]; return v && v.kv === (m.kv || 0) && !m.pwChanged ? v.password : null; }
VIEWS.comptes = () => {
  if (!isAdmin()) return `<div class="empty"><strong>Réservé à l'admin du site</strong></div>`;
  if (!vaultBase()) return `<div class="empty"><strong>Mise à jour de sécurité nécessaire</strong>Recharge la page pour la lancer.</div>`;
  const ms = GRADES.flatMap(g => members().filter(m => m.grade === g));
  const rows = ms.map(m => {
    const pw = knownPw(m); const mine = m.id === S.meId; const k = 'reset:' + m.id; const has = (m.kv || 0) >= 1;
    let shown;
    if (mine) shown = '<span style="color:var(--muted)">Le tien (Paramètres pour le changer)</span>';
    else if (!has) shown = '<span style="color:var(--warn)">Pas encore de mot de passe</span>';
    else if (!pw) shown = '<span style="color:var(--muted)">Changé par le membre</span>';
    else shown = S.reveal[m.id] ? `<code class="num" style="font-size:13.5px;letter-spacing:.04em">${esc(pw)}</code>` : `<code style="color:var(--dim)">••••-••••-${esc(pw.slice(-4))}</code>`;
    let acts = '';
    if (pw && !mine) acts += `<button class="btn sm" data-a="reveal" data-id="${esc(m.id)}">${S.reveal[m.id] ? 'Masquer' : 'Afficher'}</button><button class="btn sm" data-a="copyacc" data-id="${esc(m.id)}">${ic('copy')}Copier</button>`;
    if (!mine && !has) acts += `<button class="btn pri sm" data-a="mkacc" data-id="${esc(m.id)}">${ic('plus')}Créer son mot de passe</button>`;
    else if (!mine) acts += S.confirm === k ? `<button class="btn red sm" data-a="mkacc" data-id="${esc(m.id)}">Confirmer</button><button class="btn sm" data-a="noconfirm">Annuler</button>` : `<button class="btn ghost sm" data-a="askconfirm" data-k="${k}">Réinitialiser</button>`;
    return `<tr><td><b>${esc(m.name)}</b>${mine ? ' <span class="st-pill info">toi</span>' : ''}</td><td><span class="grade" style="--gc:${GCOL[m.grade]}">${esc(m.grade)}</span></td><td>${shown}</td><td style="text-align:right;white-space:nowrap"><div class="row" style="justify-content:flex-end;gap:6px">${acts}</div></td></tr>`;
  }).join('');
  const missing = ms.filter(m => !(m.kv >= 1) && m.id !== S.meId).length;
  return `<div class="banner">${ic('lock')}<span>Envoie à chaque membre <b>son</b> mot de passe en message privé (bouton « Copier »). Son identifiant est son nom dans le crew. Il pourra le changer dans Paramètres : tu ne le verras plus.</span></div>
    ${missing ? `<div class="toolbar" style="margin-bottom:14px"><span class="lbl">${missing} membre${missing>1?'s':''} sans mot de passe</span><span class="spacer"></span><button class="btn pri sm" data-a="mkallacc">${ic('plus')}Créer les mots de passe manquants</button></div>` : ''}
    <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Membre (identifiant)</th><th>Grade</th><th>Mot de passe de départ</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin:12px 0 0">« Réinitialiser » crée un nouveau mot de passe et désactive l'ancien immédiatement (oubli ou fuite). Un membre viré ne peut plus rien modifier.</p></div>`;
};

/* ---------- Connexion ---------- */
function openLogin(state){ S.loginOpen = true; S.loginMsg = state || ''; S.wiz = null; S.secOpen = false; renderSync(); render(); renderLogin(S.loginMsg); }
function renderLogin(state){
  const root = $('#modal');
  if (!S.loginOpen) { if (!S.wiz && !S.secOpen) root.innerHTML = ''; return; }
  if (S.migrate) return renderMigration(state);
  const msgs = {
    bad: 'Identifiant ou mot de passe incorrect.',
    removed: 'Ce membre ne fait plus partie du crew.',
    reset: "Ton mot de passe a changé. Utilise le nouveau (ou demande-le à l'admin du crew).",
    err: 'Connexion impossible. Vérifie ta connexion internet puis réessaie.'
  };
  const msg = state === 'wait' ? '<p>Connexion…</p>' : msgs[state] ? `<div class="banner" style="margin:0">${ic('lock')}<span>${msgs[state]}</span></div>` : '';
  root.innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-label="Connexion"><div class="idm">
    <div class="row">${ic('shield')}<h3>Connexion au crew</h3></div>
    <p>Ton identifiant est ton nom dans le crew. Le mot de passe t'est envoyé en privé par l'admin.</p>
    <label class="field" for="login-id">Identifiant<input class="inp" id="login-id" autocomplete="username" spellcheck="false" placeholder="Le R" value="${esc(S.loginPrefill||'')}"></label>
    <label class="field" for="login-pw">Mot de passe<input class="inp" id="login-pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <div class="row"><button class="btn pri" data-a="login" ${state==='wait'?'disabled':''}>Se connecter</button></div>
    <p class="hint" style="margin:0;font-size:11.5px">Tu as encore un ancien code du type XXXX-XXXX-XXXX ? Mets-le dans « Mot de passe ».</p>
    ${msg}
  </div></div>`;
  const f = S.loginPrefill ? $('#login-pw') : $('#login-id'); if (f && state !== 'wait') f.focus();
}
async function doLogin(){
  const name = (($('#login-id')||{}).value || '').trim(); const pw = ($('#login-pw')||{}).value || '';
  S.loginPrefill = name;
  if (!pw) { renderLogin('bad'); return; }
  renderLogin('wait');
  try {
    let id = null, k = null;
    if (name) { id = await deriveKey(name, pw); k = await Store.getRoot('keys/' + id); }
    const old = pw.trim().toUpperCase();
    if (!k && KEY_RE.test(old)) { id = old; k = await Store.getRoot('keys/' + id); }
    if (!k) { renderLogin('bad'); return; }
    await enterWithKey(id, k);
  } catch(e) { console.error(e); renderLogin('err'); }
}
async function enterWithKey(id, k){
  if (!k || k.revoked || !CODE_RE.test(k.crew || '')) { openLogin('bad'); return; }
  const md = await Store.db.doc('crews/' + k.crew + '/members/' + k.memberId).get();
  const m = md.exists ? md.data() : null;
  if (!m || m.removed) { LS.set('crew-key', null); openLogin('removed'); return; }
  if ((k.kv || 0) !== (m.kv || 0)) { LS.set('crew-key', null); openLogin('reset'); return; }
  Store.key = id; Store.code = k.crew; S.meId = k.memberId; S.myKey = k;
  LS.set('crew-key', id); LS.set('crew-code', k.crew);
  S.loginOpen = false; S.loginMsg = ''; renderLogin(); connect();
  toast(`Bienvenue ${m.name}.`);
}
function logout(state){
  clearTimeout(wizSaveT); Store.stopAll();
  Store.key = null; S.meId = null; S.myKey = null; S.mdocs = []; S.vault = {}; S.vaultOn = false;
  LS.set('crew-key', null);
  openLogin(state);
}
async function changePassword(){
  const m = me(); if (!m) return;
  const cur = ($('#pw-cur')||{}).value || '', nw = ($('#pw-new')||{}).value || '', nw2 = ($('#pw-new2')||{}).value || '';
  if (nw.length < 8) { toast('Le nouveau mot de passe doit faire au moins 8 caractères.'); return; }
  if (nw !== nw2) { toast('Les deux nouveaux mots de passe ne sont pas identiques.'); return; }
  const btn = $('#pw-btn'); if (btn) { btn.disabled = true; btn.textContent = 'Changement…'; }
  try {
    const curOk = (await deriveKey(m.name, cur)) === Store.key || cur.trim().toUpperCase() === Store.key;
    if (!curOk) { toast('Mot de passe actuel incorrect.'); return; }
    const r = await passwordWrites(m, nw, S.myKey.vault ? {vault:S.myKey.vault} : null, {pwChanged:true});
    const prevKv = S.myKey.kv; S.myKey.kv = r.kv; // évite de se déconnecter soi-même en voyant la nouvelle version
    const ok = await Store.batch(r.list);
    if (!ok) { S.myKey.kv = prevKv; return; }
    Store.key = r.id; S.myKey = Object.assign({}, S.myKey, {kv:r.kv}); LS.set('crew-key', r.id);
    ['#pw-cur','#pw-new','#pw-new2'].forEach(s => { const i = $(s); if (i) i.value = ''; });
    toast('Mot de passe changé. Garde-le pour toi.');
  } finally { const b2 = $('#pw-btn'); if (b2) { b2.disabled = false; b2.textContent = 'Changer mon mot de passe'; } }
}

/* ---------- Mise à jour de sécurité (admin, une seule fois) ---------- */
// Donne un nouveau mot de passe à tout le monde : les anciens codes, qui traînaient dans les données, ne marchent plus.
function renderSec(state){
  const root = $('#modal');
  if (!S.secOpen) return;
  const err = state && state !== 'wait' ? `<div class="banner" style="margin:0">${ic('lock')}<span>${esc(state)}</span></div>` : '';
  root.innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-label="Mise à jour de sécurité"><div class="idm">
    <div class="row">${ic('lock')}<h3>Mise à jour de sécurité</h3></div>
    <p>Les anciens codes sont remplacés par un mot de passe pour chaque membre. Tu choisis le tien ; ceux des autres sont créés au hasard et tu les retrouveras dans « Codes d'accès » pour les envoyer. Les anciens codes ne marcheront plus.</p>
    <label class="field" for="sec-pw">Ton nouveau mot de passe (8 caractères minimum)<input class="inp" id="sec-pw" type="password" autocomplete="new-password"></label>
    <label class="field" for="sec-pw2">Confirme-le<input class="inp" id="sec-pw2" type="password" autocomplete="new-password"></label>
    <div class="row"><button class="btn pri" data-a="secgo" ${state==='wait'?'disabled':''}>${state==='wait' ? 'Création des mots de passe…' : 'Mettre à jour'}</button></div>
    ${err}
  </div></div>`;
}
async function securityUpdate(){
  const pw = ($('#sec-pw')||{}).value || '', pw2 = ($('#sec-pw2')||{}).value || '';
  if (pw.length < 8) { renderSec('Ton mot de passe doit faire au moins 8 caractères.'); return; }
  if (pw !== pw2) { renderSec('Les deux mots de passe ne sont pas identiques.'); return; }
  renderSec('wait');
  const vs = 'vs' + rnd(24); const list = []; let adminNew = null;
  for (const m of members()) {
    const isMe = m.id === S.meId; const p = isMe ? pw : genCode();
    const r = await passwordWrites(m, p, isMe ? {vault:vs} : null, {pwChanged:isMe});
    list.push(...r.list);
    if (isMe) adminNew = r; else list.push({path:`v/${vs}/codes/${m.id}`, data:{password:p, kv:r.kv}});
  }
  S.myKey.kv = adminNew.kv;
  if (!(await Store.batch(list))) { S.myKey.kv = adminNew.kv - 1; renderSec("L'enregistrement a échoué. Vérifie que les nouvelles règles Firebase sont publiées."); return; }
  Store.key = adminNew.id; S.myKey = Object.assign({}, S.myKey, {kv:adminNew.kv, vault:vs}); LS.set('crew-key', adminNew.id);
  await Store.batch([{path:'crew/v3', data:{at:Date.now(), by:me().name}}]);
  S.secOpen = false; $('#modal').innerHTML = ''; location.hash = 'comptes';
  if (!S.vaultOn) { S.vaultOn = true; Store.watchColl(vaultBase(), v => { const o = {}; v.forEach(d => { o[d.id] = d; }); S.vault = o; scheduleRender(); }); }
  toast('Mots de passe créés. Envoie maintenant le sien à chaque membre.');
}

/* ---------- Premier passage d'un crew sans codes (lien #migration) ---------- */
function renderMigration(state){
  const root = $('#modal');
  const err = state && state !== 'wait' ? `<div class="banner" style="margin:0">${ic('lock')}<span>${esc(state)}</span></div>` : '';
  root.innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-label="Mots de passe"><div class="idm">
    <div class="row">${ic('lock')}<h3>Passage aux mots de passe</h3></div>
    <p>Chaque membre aura un mot de passe. À faire <b>une seule fois</b>, par l'admin du site. Les OP, bilans, coffre et formations sont conservés.</p>
    <label class="field" for="mig-name">Ton nom dans le crew (tu deviens l'admin)<input class="inp" id="mig-name" value="Le R" autocomplete="username"></label>
    <label class="field" for="mig-pw">Choisis ton mot de passe (8 caractères minimum)<input class="inp" id="mig-pw" type="password" autocomplete="new-password"></label>
    <label class="field" for="mig-pw2">Confirme ton mot de passe<input class="inp" id="mig-pw2" type="password" autocomplete="new-password"></label>
    <div class="row"><button class="btn pri" data-a="migrate" ${state==='wait'?'disabled':''}>${state==='wait' ? 'Création… (ne ferme pas la page)' : `${ic('lock')}Créer les mots de passe`}</button></div>
    ${err}
  </div></div>`;
}
async function migrate(){
  const name = (($('#mig-name')||{}).value || '').trim(); const pw = ($('#mig-pw')||{}).value || ''; const pw2 = ($('#mig-pw2')||{}).value || '';
  if (pw.length < 8) { renderMigration('Ton mot de passe doit faire au moins 8 caractères.'); return; }
  if (pw !== pw2) { renderMigration('Les deux mots de passe ne sont pas identiques.'); return; }
  Store.code = LS.get('crew-code', null);
  if (!CODE_RE.test(Store.code || '')) { renderMigration("Ce navigateur ne connaît pas le crew. Ouvre ce lien sur l'appareil où tu utilisais déjà le site."); return; }
  renderMigration('wait');
  try {
    if ((await Store.db.doc(Store.p('crew/meta')).get()).exists) { S.migrate = false; openLogin(); return; }
    let ms = (await Store.db.collection(Store.p('members')).get()).docs.map(d => Object.assign({}, d.data(), {id:d.id}));
    if (!ms.length) { const c = await Store.db.doc(Store.p('crew/config')).get(); ms = ((c.exists && c.data().members) || []).map(m => Object.assign({removed:false}, m)); }
    const admin = ms.find(m => !m.removed && slug(m.name) === slug(name));
    if (!admin) { renderMigration(`Aucun membre actif ne s'appelle « ${name} ».`); return; }
    S.mdocs = ms;
    const vs = 'vs' + rnd(24); const list = []; let adminNew = null;
    for (const m of ms.filter(x => !x.removed)) {
      const isMe = m.id === admin.id; const p = isMe ? pw : genCode();
      const r = await passwordWrites(m, p, isMe ? {vault:vs} : null, {pwChanged:isMe, admin:isMe, removed:false});
      list.push(...r.list);
      if (isMe) adminNew = r; else list.push({path:`v/${vs}/codes/${m.id}`, data:{password:p, kv:r.kv}});
    }
    list.push({path:'crew/v3', data:{at:Date.now(), by:admin.name}});
    if (!(await Store.batch(list))) throw new Error('write');
    if (!(await Store.batch([{path:'crew/meta', data:{secured:true, at:Date.now(), admin:admin.id}}]))) throw new Error('write');
    S.migrate = false; location.hash = 'comptes';
    const k = await Store.getRoot('keys/' + adminNew.id);
    await enterWithKey(adminNew.id, k);
    toast('Mots de passe créés. Envoie maintenant le sien à chaque membre.');
  } catch(e) { console.error(e); renderMigration("L'enregistrement a échoué. Vérifie que les nouvelles règles Firebase sont publiées, puis réessaie."); }
}

/* ---------- Sanctions ---------- */
const warnCount = id => S.sanctions.filter(s => s.memberId === id && s.type === 'avert' && !s.cancelled).length;
const SX_TYPES = {rappel:{label:"Rappel à l'ordre", cls:'info'}, avert:{label:'Avertissement', cls:'fail'}};
VIEWS.sanctions = () => {
  const exec = isExec(); const boss = isBoss();
  const targets = GRADES.flatMap(g => members().filter(m => m.grade === g && canEditMember(m)));
  if (!targets.some(m => m.id === S.sxMember)) S.sxMember = targets[0] ? targets[0].id : '';
  const tgt = S.mdocs.find(m => m.id === S.sxMember);
  const willKick = tgt && S.sxType === 'avert' && warnCount(tgt.id) >= 1;
  const form = exec ? `<div class="panel"><h3>Sanctionner</h3><p class="hint">${boss ? 'Tu peux sanctionner tous les membres sauf l\'admin.' : 'En tant qu\'Exécutant, tu peux sanctionner les Lieutenants et les Membres.'}</p>
      ${targets.length ? `<div class="stack" style="gap:12px">
        <div class="row" style="align-items:flex-end">
          <label class="field" for="sx-member" style="flex:1;min-width:160px">Membre<select class="inp" id="sx-member" data-c="sxmember">${targets.map(m => `<option value="${esc(m.id)}" ${m.id===S.sxMember?'selected':''}>${esc(m.name)} · ${esc(m.grade)} · ${warnCount(m.id)}/2 avert.</option>`).join('')}</select></label>
          <div class="field">Type<div class="seg" role="group" aria-label="Type de sanction"><button data-a="sxtype" data-t="rappel" aria-pressed="${S.sxType==='rappel'}">Rappel à l'ordre</button><button data-a="sxtype" data-t="avert" aria-pressed="${S.sxType==='avert'}">Avertissement</button></div></div>
        </div>
        <label class="field" for="sx-reason">Raison<input class="inp" id="sx-reason" data-c="sxreason" maxlength="160" placeholder="Ex. Absent à l'OP de samedi sans prévenir" value="${esc(S.sxReason||'')}"></label>
        ${willKick ? `<div class="banner" style="margin:0">${ic('lock')}<span><b>${esc(tgt.name)}</b> a déjà 1 avertissement : un 2e le vire du crew.</span></div>` : ''}
        <div class="row">${willKick && S.confirm === 'sx'
          ? `<button class="btn red" data-a="sanction">Confirmer : avertir et virer ${esc(tgt.name)}</button><button class="btn" data-a="noconfirm">Annuler</button>`
          : `<button class="btn ${willKick ? 'red' : 'pri'}" data-a="sanction">${ic('alert')}${willKick ? 'Avertir et virer' : S.sxType === 'avert' ? 'Donner un avertissement' : 'Donner un rappel à l\'ordre'}</button>`}</div>
      </div>` : '<div class="empty">Personne que tu peux sanctionner.</div>'}</div>` : `<div class="banner">${ic('lock')}<span>Seuls les Exécutants et plus peuvent donner des sanctions.</span></div>`;
  const ids = [...new Set(S.sanctions.map(s => s.memberId))];
  const summary = ids.map(id => { const m = S.mdocs.find(x => x.id === id); const name = m ? m.name : (S.sanctions.find(s => s.memberId === id) || {}).member;
    const w = warnCount(id); const r = S.sanctions.filter(s => s.memberId === id && s.type === 'rappel' && !s.cancelled).length;
    return {id, name, w, r, gone: m && m.removed}; }).filter(x => x.w || x.r).sort((a,b) => b.w - a.w || b.r - a.r);
  const list = S.sanctions.slice().sort((a,b) => b.at - a.at);
  return `<div class="banner">${ic('info')}<span>Règle du crew : <b>2 avertissements = viré</b>. Les rappels à l'ordre ne comptent pas.</span></div>
    <div class="cols"><div class="stack">${form}
      <div class="panel"><h3>Historique</h3>${list.length ? `<div class="hist">${list.map(s => { const k = 'sxc:' + s.id;
        return `<div class="hist-r"><span><span class="st-pill ${s.cancelled ? 'wait' : SX_TYPES[s.type].cls}">${s.cancelled ? 'Annulé' : SX_TYPES[s.type].label}</span> <b>${esc(s.member)}</b><br>${esc(s.reason || '')}<br><small>Par ${esc(s.by)} · ${fmtDT(s.at)}${s.cancelled ? ` · annulé par ${esc(s.cancelledBy || '?')}` : ''}</small></span>
          <span>${boss && !s.cancelled ? (S.confirm === k ? `<button class="btn red sm" data-a="sxcancel" data-id="${esc(s.id)}">Confirmer</button> <button class="btn sm" data-a="noconfirm">Non</button>` : `<button class="btn ghost sm" data-a="askconfirm" data-k="${k}">Annuler</button>`) : ''}</span></div>`; }).join('')}</div>`

    </div>`;
};
async function giveSanction(){
  if (!isExec()) return;
  const m = S.mdocs.find(x => x.id === S.sxMember); if (!canEditMember(m)) return;
  const reasonEl = $('#sx-reason'); const reason = ((reasonEl && reasonEl.value) || S.sxReason || '').trim();
  if (!reason) { toast('Indique la raison de la sanction.'); if (reasonEl) reasonEl.focus(); return; }
  const type = S.sxType === 'rappel' ? 'rappel' : 'avert';
  const willKick = type === 'avert' && warnCount(m.id) >= 1;
  if (willKick && S.confirm !== 'sx') { S.sxReason = reason; S.confirm = 'sx'; render(); return; }

  if (ok && willKick) { await writeMember(m.id, {removed:true}); toast(`${m.name} a 2 avertissements : viré du crew.`); }
  else if (ok) toast(type === 'avert' ? `Avertissement donné à ${m.name} (${warnCount(m.id)}/2).` : `Rappel à l'ordre donné à ${m.name}.`);
  render();
}

function autoIcon(name, cat){

  if (/menu|repas|burger|sandwich|eau|boisson|nourriture|pizza/.test(n)) return 'food';
  if (/smg|fusil|carabine|ak|m4|uzi|shotgun|pompe/.test(n)) return 'rifle';
  if (/pistol|pistolet|revolver|glock|deagle/.test(n)) return 'pistol';
  if (/machette|couteau|batte|machete|knife/.test(n)) return 'knife';
  if (/gilet|kevlar|armure/.test(n)) return 'vest';
  if (/masque|cagoule/.test(n)) return 'mask';

  if (/jerry|essence|bidon/.test(n)) return 'can';

  if (/ghb|weed|coke|meth|drogue|pilule/.test(n)) return 'drug';

}

  wstep(t){ const w = S.wiz; const to = Number(t.dataset.to); if (to > 0 && !w.participants.length) return; w.step = to; S.sel = null; S.confirm = null; if (to === 2) ensureVehicles(w); wizChanged(); $('#modal .ov') && ($('#modal .ov').scrollTop = 0); },
  ptoggle(t){ const w = S.wiz, n = t.dataset.n; const i = w.participants.indexOf(n); if (i >= 0) w.participants.splice(i,1); else w.participants.push(n); cleanWiz(w); wizChanged(); },
  pall(){ const w = S.wiz; members().forEach(m => { if (!w.participants.includes(m.name)) w.participants.push(m.name); }); wizChanged(); },
  pnone(){ const w = S.wiz; w.participants = []; cleanWiz(w); wizChanged(); },
  guestadd(){ const inp = $('#guest-in'); const v = (inp.value || '').trim().slice(0,30); if (!v) return; if (!S.wiz.participants.includes(v)) S.wiz.participants.push(v); wizChanged(); const ni = $('#guest-in'); if (ni) ni.focus(); },
  poste(t){ const w = S.wiz; w.postes[t.dataset.n] = w.postes[t.dataset.n] === t.dataset.p ? undefined : t.dataset.p; if (!w.postes[t.dataset.n]) delete w.postes[t.dataset.n]; wizChanged(); },
  pauto(){ autoPostes(S.wiz); wizChanged(); toast('Postes attribués au hasard.'); },
  vcount(t){ const w = S.wiz; if (Number(t.dataset.d) > 0) w.vehicles.push({seats:4, slots:[null,null,null,null]}); else if (w.vehicles.length > 1) w.vehicles.pop(); S.sel = null; wizChanged(); },
  vseats(t){ const v = S.wiz.vehicles[Number(t.dataset.v)]; const n = Number(t.dataset.n); if (v.seats === n) return;
    if (n === 4) { const [a,b,c,d,e] = v.slots; v.slots = [a,b,c,e||d||null].map(x => x||null); if (d && e) {/* middle passenger goes back to pool */} }
    else { const [a,b,c,d] = v.slots; v.slots = [a||null,b||null,c||null,null,d||null]; }
    v.seats = n; S.sel = null; wizChanged(); },
  vauto(){ autoVehicles(S.wiz); S.sel = null; wizChanged(); },
  vclear(){ S.wiz.vehicles.forEach(v => v.slots = Array(v.seats).fill(null)); S.sel = null; wizChanged(); },
  poolpick(t, e){ e.stopPropagation(); const n = t.dataset.n; S.sel = (S.sel && S.sel.name === n) ? null : {name:n, from:null}; renderWiz(); },
  pooldrop(){ if (S.sel && S.sel.from) { placeSel('pool'); wizChanged(); } },
  seat(t){ const v = Number(t.dataset.v), s = Number(t.dataset.s); const w = S.wiz; const occ = w.vehicles[v].slots[s];
    if (S.sel) { placeSel({v,s}); wizChanged(); }
    else if (occ) { S.sel = {name:occ, from:{v,s}}; renderWiz(); } },
  wresult(t){ S.wiz.result = t.dataset.r; wizChanged(); },
  copywiz(){ const txt = discordText(opFromWiz(S.wiz)); copy(txt, $('#disc')); },
  wsave(){
    const w = S.wiz; const total = parseMoney(w.total);
    if (w.result !== 'fail' && !total && !(MBY[w.missionId] || {}).crew) { toast('Indique le total gagné avant d\'enregistrer.'); const i = $('#total'); if (i) i.focus(); return; }
    const op = Object.assign(opFromWiz(w), {startedAt:w.startedAt, endedAt:Date.now(), by:w.by, vehicles:w.vehicles.map(v => ({seats:v.seats, slots:v.slots}))});
    clearTimeout(wizSaveT);
    S.ops.push(Object.assign({}, op, {id:w.id}));
    S.live = S.live.filter(l => l.id !== w.id);
    Store.write('ops/' + w.id, op); Store.write('live/' + w.id, null);
    S.wiz = null; S.sel = null; S.confirm = null; renderWiz();
    location.hash = 'bilans'; S.view = 'bilans'; S.period = 'week'; render();
    copy(discordText(op), null);
  },
  wcancel(){ clearTimeout(wizSaveT); const id = S.wiz.id; S.live = S.live.filter(l => l.id !== id); Store.write('live/' + id, null); S.wiz = null; S.sel = null; S.confirm = null; renderWiz(); render(); toast('OP annulée.'); },
  period(t){ S.period = t.dataset.p; render(); },
  copyop(t){ const o = S.ops.find(x => x.id === t.dataset.id); if (o) copy(discordText(o), null); },
  delop(t){ const id = t.dataset.id; S.ops = S.ops.filter(o => o.id !== id); Store.write('ops/' + id, null); S.confirm = null; render(); toast('Bilan supprimé.'); },
  spin(){ if (isLead()) spin(); },
  cexcl(t){ if (!isLead()) return; const id = t.dataset.id; const ex = new Set(cfg().coffreExclude || []); ex.has(id) ? ex.delete(id) : ex.add(id); saveConfig({coffreExclude:[...ex]}); },
  citem(t){ const cur = S.coffre.find(c => c.id === thisWeek()); if (!cur) return; const items = cur.items.map(x => Object.assign({}, x)); const i = Number(t.dataset.i); items[i].done = !items[i].done; cur.items = items;
    if (!(isExec() || (me() && me().id === cur.memberId))) return;
    const doc = Object.assign({}, cur); delete doc.id; delete doc._k; Store.write('coffre/' + cur.id, doc); render(); },
  fjoin(t){ if (me()) { setForm(me(), t.dataset.f, 'inscrit'); toast('Demande envoyée : un lead validera ta formation.'); } },
  fleave(t){ if (me()) setForm(me(), t.dataset.f, null); },
  fvalid(t){ if (!isExec()) return; const m = members().find(x => x.id === t.dataset.m); if (m) { setForm(m, t.dataset.f, 'forme'); toast(`${m.name} est formé.`); } },
  fdeny(t){ const m = members().find(x => x.id === t.dataset.m); if (m) setForm(m, t.dataset.f, null); },
  fcell(t){ if (!isLead()) return; const m = members().find(x => x.id === t.dataset.m); if (!m) return; const s = formState(m.id, t.dataset.f); setForm(m, t.dataset.f, s === null ? 'inscrit' : s === 'inscrit' ? 'forme' : null); },
  madd(){ if (!isBoss()) return; const nameEl = $('#madd-name'); const name = (nameEl.value || '').trim().slice(0,30); if (!name) { nameEl.focus(); return; }
    if (members().some(m => m.name.toLowerCase() === name.toLowerCase())) { toast(`${name} fait déjà partie du crew.`); return; }
    let id = slug(name); if (/^\d/.test(id)) id = 'm' + id; while (S.mdocs.some(m => m.id === id)) id += '-2';
    const grade = $('#madd-grade').value; nameEl.value = '';
    writeMember(id, {name, grade, admin:false, removed:false});
    toast(isAdmin() ? `${name} ajouté. Crée son mot de passe dans Codes d'accès.` : `${name} ajouté. L'admin doit lui créer son mot de passe.`);
    const n = $('#madd-name'); if (n) n.focus(); },
  mdel(t){ const m = S.mdocs.find(x => x.id === t.dataset.id); S.confirm = null; if (!canEditMember(m)) return;
    writeMember(m.id, {removed:true}).then(ok => { if (ok) toast(`${m.name} a été viré du crew.`); });
  },
  iadd(){ saveConfig({coffreItems: (cfg().coffreItems || DEFAULT_ITEMS).concat([{label:'Nouvel objet', qty:100}])}); },
  idel(t){ const i = Number(t.dataset.i); saveConfig({coffreItems: (cfg().coffreItems || DEFAULT_ITEMS).filter((_,k) => k !== i)}); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const a = t.dataset.a;
  if (a === 'pooldrop' && e.target.closest('[data-a]') !== t) return;
  if (A[a]) A[a](t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'guest-in') { e.preventDefault(); A.guestadd(); }
  if (e.key === 'Enter' && e.target.id === 'madd-name') { e.preventDefault(); A.madd(); }
  if (e.key === 'Escape') { if (S.sel) { S.sel = null; renderWiz(); } }
  if (e.key === 'Enter' && (e.target.id === 'login-pw' || e.target.id === 'login-id')) { e.preventDefault(); A.login(); }
  if (e.key === 'Enter' && e.target.id === 'mig-pw2') { e.preventDefault(); A.migrate(); }
  if (e.key === 'Enter' && e.target.id === 'sec-pw2') { e.preventDefault(); A.secgo(); }
  if (e.key === 'Enter' && e.target.id === 'pw-new2') { e.preventDefault(); A.chpw(); }
  if (e.key === 'Enter' && e.target.id === 'sx-reason') { e.preventDefault(); A.sanction(); }
  if (e.key === 'Enter' && e.target.id === 'ia-name') { e.preventDefault(); A.invadd(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.c === 'invq') { S.invQ = t.value; const g = $('#inv-grid'); if (g) g.innerHTML = gridHtml(); return; }
  if (t.dataset.c === 'sxreason') { S.sxReason = t.value; return; }
  if (t.dataset.c !== 'total' || !S.wiz) return;
  S.wiz.total = t.value; saveWiz();
  const op = opFromWiz(S.wiz); const d = $('#disc'); if (d) d.textContent = discordText(op);
  const sh = $('#share'); const n = S.wiz.participants.length; if (sh) sh.textContent = money(n ? Math.floor(op.total/n) : 0) + ' $';
});
document.addEventListener('change', e => {
  const t = e.target; const c = t.dataset.c; if (!c) return;
  const items = () => (cfg().coffreItems || DEFAULT_ITEMS).map(x => Object.assign({}, x));
  switch (c) {
    case 'prio': S.wiz.prio = t.checked; saveWiz(); break;
    case 'withp': S.wiz.withPostes = t.checked; wizChanged(); break;
    case 'total': t.value = S.wiz.total ? money(parseMoney(S.wiz.total)) : ''; break;
    case 'exlast': saveConfig({coffreExcludeLast: t.checked}); break;
    case 'crewname': saveConfig({crewName: t.value.trim().slice(0,24) || 'Crew'}); break;
    case 'crewlevel': saveConfig({crewLevel: Math.max(1, Math.min(99, parseInt(t.value,10) || 1))}); break;
    case 'ilabel': { const it = items(); it[Number(t.dataset.i)].label = t.value.trim().slice(0,40) || 'Objet'; saveConfig({coffreItems: it}); break; }
    case 'iqty': { const it = items(); it[Number(t.dataset.i)].qty = Math.max(1, parseInt(t.value,10) || 1); saveConfig({coffreItems: it}); break; }
    case 'sxmember': S.sxMember = t.value; S.confirm = null; { const r = $('#sx-reason'); if (r) S.sxReason = r.value; } render(); break;
    case 'mgrade': { const m = S.mdocs.find(x => x.id === t.dataset.id); if (canEditMember(m) && gradeChoices().includes(t.value)) writeMember(m.id, {grade: t.value}); else render(); break; }
  }
});
/* drag & drop for vehicles (desktop) */
document.addEventListener('dragstart', e => {
  const t = e.target.closest && e.target.closest('[data-drag]'); if (!t || !S.wiz) return;
  const n = t.dataset.drag; const st = seatOf(S.wiz, n);
  S.sel = {name:n, from: st ? {v:st.v, s:st.s} : null};
  try { e.dataTransfer.setData('text/plain', n); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d && S.sel) { e.preventDefault(); d.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('drop'); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('[data-drop]'); if (!d || !S.sel) return; e.preventDefault();
  if (d.dataset.drop === 'pool') { if (S.sel.from) placeSel('pool'); else S.sel = null; }
  else placeSel({v:Number(d.dataset.v), s:Number(d.dataset.s)});
  wizChanged();
});
document.addEventListener('dragend', () => { if (S.sel) { S.sel = null; renderWiz(); } });

/* ---------- Routing & boot ---------- */
function route(){ const h = location.hash.replace('#',''); S.view = NAV.some(n => n.id === h && !n.soon) ? h : 'missions'; S.confirm = null; render(); }
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (S.view === 'coffre') drawWheel(); });
setInterval(() => { if (S.view === 'missions' && !S.wiz) scheduleRender(); }, 60000);

$('#quit-ic').innerHTML = ic('logout');
route();

let slowT;
function connect(){
  Store.stopAll();
  Object.assign(S, {config:null, cfgLoaded:false, ops:[], live:[], coffre:[], forms:[], mdocs:[], vault:{}, vaultOn:false, sanctions:[], inv:[], invlog:[], syncErr:false, slow:false, v3:undefined});
  clearTimeout(slowT); slowT = setTimeout(() => { if (!Store.synced) { S.slow = true; renderSync(); } }, 10000);
  Store.watchDoc('crew/config', d => { S.config = d; S.cfgLoaded = true; scheduleRender(); });
  Store.watchDoc('crew/v3', d => { S.v3 = !!d; checkSec(); });
  Store.watchColl('members', l => { S.mdocs = l;
    const m = S.mdocs.find(x => x.id === S.meId);
    if (Store.mode === 'fire' && S.meId && l.length && S.myKey) {
      if (!m || m.removed) { logout('removed'); return; }
      if ((m.kv || 0) !== (S.myKey.kv || 0)) { logout('reset'); return; }
    }
    if (isAdmin() && vaultBase() && !S.vaultOn) { S.vaultOn = true; Store.watchColl(vaultBase(), v => { const o = {}; v.forEach(d => { o[d.id] = d; }); S.vault = o; scheduleRender(); }); }
    checkSec(); scheduleRender(); });
  Store.watchColl('ops', l => { S.ops = l; scheduleRender(); });
  Store.watchColl('live', l => { S.live = l; scheduleRender(); });
  Store.watchColl('coffre', l => { S.coffre = l; scheduleRender(); });
  Store.watchColl('formations', l => { S.forms = l; scheduleRender(); });
  Store.watchColl('sanctions', l => { S.sanctions = l; scheduleRender(); });
  Store.watchColl('inv', l => { S.inv = l; scheduleRender(); });
  Store.watchColl('invlog', l => { S.invlog = l; scheduleRender(); }, {order:'at', dir:'desc', limit:40});
  renderSync(); render();
}
// L'admin connecté avec un ancien code doit faire la mise à jour de sécurité.
function checkSec(){
  if (Store.mode !== 'fire' || S.secOpen || S.v3 !== false || !S.mdocs.length || !isAdmin()) return;
  S.secOpen = true; S.wiz = null; renderSec();
}

Store.init();
(async () => {
  const hash = location.hash;
  const legacy = (hash.match(/^#code=([A-Za-z0-9_-]{16,64})$/) || [])[1];
  const idp = (hash.match(/^#id=(.+)$/) || [])[1];
  S.migrate = hash === '#migration';
  if (legacy) LS.set('crew-code', legacy); // ancien lien d'invitation : retenu pour la migration
  if (idp) { try { S.loginPrefill = decodeURIComponent(idp); } catch(e) {} }
  if (legacy || idp || S.migrate || /^#cle=/.test(hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {} }
  if (Store.mode !== 'fire') { connect(); return; }
  const cle = (hash.match(/^#cle=([A-Za-z0-9-]+)$/) || [])[1];
  const saved = cle ? cle.toUpperCase() : LS.get('crew-key', null);
  if (S.migrate) {
    const crew = LS.get('crew-code', null);
    let secured = true;
    try { secured = !CODE_RE.test(crew || '') || (await Store.db.doc('crews/' + crew + '/crew/meta').get()).exists; } catch(e) {}
    if (!secured) { S.loginOpen = true; renderSync(); render(); renderMigration(); return; }
    S.migrate = false;
  }
  if (saved) {
    S.loginOpen = true; renderSync(); renderLogin('wait');
    try { const k = await Store.getRoot('keys/' + saved); if (k) { await enterWithKey(saved, k); return; } } catch(e) {}
  }
  openLogin();
})();
})();
</script>
</body>
