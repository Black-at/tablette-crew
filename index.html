let identT;
function identTick(){ clearTimeout(identT); identT = setTimeout(() => { identEnforce().catch(e => console.error(e)); }, 1200); }
setInterval(identTick, 10 * 60e3);
// Demande la fiche, donne / retire les sanctions automatiques. Chaque membre le fait pour lui-même ;
// les Exécutants et plus le font aussi pour les membres qu'ils peuvent sanctionner (au cas où le membre ne se connecte plus).
async function identEnforce(){
  const my = me(); if (!my || !S.identLoaded || !S.sxLoaded || S.loginOpen) return;
  const mine = identOf(my.id);
  if (!identDone(mine)) {
    if ((!mine || !mine.askedAt) && !S.askWritten) { S.askWritten = true; await writeIdent(my.id, {askedAt:Date.now()}); }
    if (!S.identOpen && !S.identSkip) { S.identOpen = true; renderIdent(); }
  }
  const now = Date.now();
  for (const m of members()) {
    if (m.admin) continue;
    const self = m.id === my.id; const d = identOf(m.id);
    if (identDone(d)) { // fiche complète : on retire les sanctions automatiques
      if (!(self || isExec())) continue;
      for (const type of ['rappel', 'avert']) { const s = autoSx(m.id, type); if (!s || s.cancelled) continue;
        s.cancelled = true; s.cancelledBy = 'Tablette (carte ajoutée)';
        await Store.write('sanctions/' + s.id, Object.assign({}, s, {cancelled:true, cancelledBy:'Tablette (carte ajoutée)', cancelledAt:now})); }
      continue;
    }
    if (!d || !d.askedAt || !(self || (isExec() && canEditMember(m)))) continue;
    for (const [type, lim, label] of [['rappel', ID_RAPPEL, '24 h'], ['avert', ID_AVERT, '3 jours']]) {
      if (now - d.askedAt < lim || autoSx(m.id, type)) continue;
      const doc = {memberId:m.id, member:m.name, type, reason:`Carte d'identité RP pas ajoutée sur la tablette après ${label}`, at:now, by:'Tablette (automatique)', byId:my.id, auto:'id'};
      S.sanctions.push(Object.assign({}, doc, {id:autoSxId(m.id, type)}));
      await Store.write('sanctions/' + autoSxId(m.id, type), doc);
      if (self) toast(type === 'avert' ? "Avertissement : ta carte d'identité RP n'est toujours pas sur la tablette." : "Rappel à l'ordre : ajoute ta carte d'identité RP sur la tablette.");
    }
  }
  scheduleRender();
}

    writeForm(m, d.formation, {status:'forme', validatedBy:my.name, validatedById:my.id, validatedAt:Date.now()}, `formé par ${my.name}`).then(ok => { if (ok) toast(`${m.name} est formé ${FBY[d.formation].name}.`); }); },
  fredo(t){ const d = S.forms.find(x => x.id === t.dataset.id); const my = me(); if (!d || !my) return; const m = S.mdocs.find(x => x.id === d.memberId); if (!m) return;
    writeForm(m, d.formation, {status:'inscrit', trainerId:'', trainer:'', session:'', note:`À refaire (avis de ${my.name})`, at:Date.now()}, `à refaire (${my.name})`).then(ok => { if (ok) toast(`${m.name} devra refaire la formation.`); }); },
  fdrop(t){ const d = S.forms.find(x => x.id === t.dataset.id); const my = me(); if (!d || !my) return; const m = S.mdocs.find(x => x.id === d.memberId); if (!m) return;
    writeForm(m, d.formation, {status:'inscrit', trainerId:'', trainer:'', session:'', note:'Formateur désisté'}, `${my.name} s'est désisté`).then(ok => { if (ok) toast('Demande remise aux autres formateurs.'); }); },
  ftrainer(t){ if (!isBoss()) return; const f = t.dataset.f, id = t.dataset.m; const all = Object.assign({}, cfg().trainers || {}); const l = (all[f] || []).slice(); const i = l.indexOf(id);
    if (i >= 0) l.splice(i, 1); else l.push(id); all[f] = l; saveConfig({trainers: all}); toast(i >= 0 ? `${mName(id)} n'est plus formateur ${FBY[f].name}.` : `${mName(id)} est formateur ${FBY[f].name}.`); },
  fcell(t){ if (!isExec()) return; const m = members().find(x => x.id === t.dataset.m); if (!m) return; const s = formState(m.id, t.dataset.f); setForm(m, t.dataset.f, s === null ? 'inscrit' : s === 'forme' ? null : 'forme'); },
  madd(){ if (!isBoss()) return; const nameEl = $('#madd-name'); const name = (nameEl.value || '').trim().slice(0,30); if (!name) { nameEl.focus(); return; }
    if (members().some(m => m.name.toLowerCase() === name.toLowerCase())) { toast(`${name} fait déjà partie du crew.`); return; }
    let id = slug(name); if (/^\d/.test(id)) id = 'm' + id; while (S.mdocs.some(m => m.id === id)) id += '-2';
    const grade = $('#madd-grade').value; nameEl.value = '';
    writeMember(id, {name, grade, admin:false, removed:false});
    toast(isAdmin() ? `${name} ajouté. Crée son mot de passe dans Codes d'accès.` : `${name} ajouté. L'admin doit lui créer son mot de passe.`);
    const n = $('#madd-name'); if (n) n.focus(); },
  mdel(t){ const m = S.mdocs.find(x => x.id === t.dataset.id); S.confirm = null; if (!canEditMember(m)) return;
    writeMember(m.id, {removed:true}).then(ok => { if (ok) toast(`${m.name} a été viré du crew.`); });
  },
  iadd(){ saveConfig({coffreItems: (cfg().coffreItems || DEFAULT_ITEMS).concat([{label:'Nouvel objet', qty:100}])}); },
  idel(t){ const i = Number(t.dataset.i); saveConfig({coffreItems: (cfg().coffreItems || DEFAULT_ITEMS).filter((_,k) => k !== i)}); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const a = t.dataset.a;
  if (a === 'pooldrop' && e.target.closest('[data-a]') !== t) return;
  if (A[a]) A[a](t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'guest-in') { e.preventDefault(); A.guestadd(); }
  if (e.key === 'Enter' && e.target.id === 'madd-name') { e.preventDefault(); A.madd(); }
  if (e.key === 'Escape') { if (S.sel) { S.sel = null; renderWiz(); } }
  if (e.key === 'Enter' && (e.target.id === 'login-pw' || e.target.id === 'login-id')) { e.preventDefault(); A.login(); }
  if (e.key === 'Enter' && e.target.id === 'mig-pw2') { e.preventDefault(); A.migrate(); }
  if (e.key === 'Enter' && e.target.id === 'sec-pw2') { e.preventDefault(); A.secgo(); }
  if (e.key === 'Enter' && e.target.id === 'pw-new2') { e.preventDefault(); A.chpw(); }
  if (e.key === 'Enter' && e.target.id === 'sx-reason') { e.preventDefault(); A.sanction(); }
  if (e.key === 'Enter' && e.target.id === 'ia-name') { e.preventDefault(); A.invadd(); }
  if (e.key === 'Enter' && e.target.id === 'lguest-in') { e.preventDefault(); A.lguest(); }
  if (e.key === 'Enter' && e.target.id === 'org-new') { e.preventDefault(); A.orgnew(); }
  if (e.key === 'Enter' && e.target.id === 'oe-g') { e.preventDefault(); A.opguest(); }
  if (e.key === 'Escape') A.lbclose();
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.edit) S.labEdit = d.open ? d.dataset.edit : (S.labEdit === d.dataset.edit ? null : S.labEdit); }, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.c === 'invq') { S.invQ = t.value; const g = $('#inv-grid'); if (g) g.innerHTML = gridHtml(); return; }
  if (t.dataset.c === 'sxreason') { S.sxReason = t.value; return; }
  if (t.dataset.c === 'idf') { S.idDraft[t.dataset.f] = t.value; return; }
  if (t.dataset.c === 'oe' && S.oe && ['total', 'targetOrg'].includes(t.dataset.f)) { S.oe[t.dataset.f] = t.value; return; }
  if (t.dataset.c === 'logq') { S.logQ = t.value; render(); const i = $('#log-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  if (t.dataset.c === 'tgt' && S.wiz) { S.wiz.targetOrg = t.value; saveWiz(); const d = $('#disc'); if (d) d.textContent = discordText(opFromWiz(S.wiz)); return; }
  if (t.dataset.c === 'orgq') { S.orgQ = t.value; render(); const i = $('#org-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  if (S.lw && ['lprod','lpoch','lsrcq','lextra','lshare','lmoney','lper','lqty'].includes(t.dataset.c)) { const w = S.lw, c = t.dataset.c;
    if (c === 'lper') w.per[t.dataset.n] = t.value.replace(/\D/g, ''); if (c === 'lqty') w.qty = t.value.replace(/\D/g, '');
    if (c === 'lprod') w.product = t.value; if (c === 'lpoch') w.pochons = t.value.replace(/\D/g, ''); if (c === 'lextra') w.extra = t.value;
    if (c === 'lsrcq') w.sources[t.dataset.id] = t.value; if (c === 'lshare') w.shares[t.dataset.n] = t.value; if (c === 'lmoney') w.money[t.dataset.n] = t.value;
    lwRefresh(); return; }
  if (t.dataset.c !== 'total' || !S.wiz) return;
  S.wiz.total = t.value; saveWiz();
  const op = opFromWiz(S.wiz); const d = $('#disc'); if (d) d.textContent = discordText(op);
  const sh = $('#share'); const n = S.wiz.participants.length; if (sh) sh.textContent = money(n ? Math.floor(op.total/n) : 0) + ' $';
});
document.addEventListener('change', e => {
  const t = e.target; const c = t.dataset.c; if (!c) return;
  const items = () => (cfg().coffreItems || DEFAULT_ITEMS).map(x => Object.assign({}, x));
  switch (c) {
    case 'prio': S.wiz.prio = t.checked; saveWiz(); break;
    case 'withp': S.wiz.withPostes = t.checked; wizChanged(); break;
    case 'total': t.value = S.wiz.total ? money(parseMoney(S.wiz.total)) : ''; break;
    case 'exlast': saveConfig({coffreExcludeLast: t.checked}); break;
    case 'crewname': saveConfig({crewName: t.value.trim().slice(0,24) || 'Crew'}); break;
    case 'crewlevel': saveConfig({crewLevel: Math.max(1, Math.min(99, parseInt(t.value,10) || 1))}); break;
    case 'ilabel': { const it = items(); it[Number(t.dataset.i)].label = t.value.trim().slice(0,40) || 'Objet'; saveConfig({coffreItems: it}); break; }
    case 'iqty': { const it = items(); it[Number(t.dataset.i)].qty = Math.max(1, parseInt(t.value,10) || 1); saveConfig({coffreItems: it}); break; }
    case 'oe': if (S.oe) { S.oe[t.dataset.f] = t.dataset.f === 'total' ? (parseMoney(t.value) ? money(parseMoney(t.value)) : '') : t.value; render(); } break;
    case 'oep': if (S.oe) { const n = t.dataset.n; if (t.checked) { S.oe.parts[n] = ''; if (!S.oe.order.includes(n)) S.oe.order.push(n); } else delete S.oe.parts[n]; render(); } break;
    case 'oepp': if (S.oe) { S.oe.parts[t.dataset.n] = t.value; } break;
    case 'logwho': S.logWho = t.value; render(); break;
    case 'logsec': S.logSec = t.value; render(); break;
    case 'logminor': S.logMinor = t.checked; render(); break;
    case 'admpick': S.admPick = t.value; S.confirm = null; render(); break;
    case 'sxmember': S.sxMember = t.value; S.confirm = null; { const r = $('#sx-reason'); if (r) S.sxReason = r.value; } render(); break;
    case 'mgrade': { const m = S.mdocs.find(x => x.id === t.dataset.id); if (canEditMember(m) && gradeChoices().includes(t.value)) writeMember(m.id, {grade: t.value}); else render(); break; }
  }
});
/* drag & drop for vehicles (desktop) */
document.addEventListener('dragstart', e => {
  const t = e.target.closest && e.target.closest('[data-drag]'); if (!t || !S.wiz) return;
  const n = t.dataset.drag; const st = seatOf(S.wiz, n);
  S.sel = {name:n, from: st ? {v:st.v, s:st.s} : null};
  try { e.dataTransfer.setData('text/plain', n); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d && S.sel) { e.preventDefault(); d.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('drop'); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('[data-drop]'); if (!d || !S.sel) return; e.preventDefault();
  if (d.dataset.drop === 'pool') { if (S.sel.from) placeSel('pool'); else S.sel = null; }
  else placeSel({v:Number(d.dataset.v), s:Number(d.dataset.s)});
  wizChanged();
});
document.addEventListener('dragend', () => { if (S.sel) { S.sel = null; renderWiz(); } });

/* ---------- Routing & boot ---------- */
function route(){ const h = location.hash.replace('#',''); S.view = NAV.some(n => n.id === h && !n.soon) ? h : 'missions'; S.confirm = null; render(); }
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (S.view === 'coffre') drawWheel(); });
setInterval(() => { if (S.view === 'missions' && !S.wiz) scheduleRender(); }, 60000);

$('#quit-ic').innerHTML = ic('logout');
route();

let slowT;
function connect(){
  Store.stopAll();
  Object.assign(S, {config:null, cfgLoaded:false, ops:[], live:[], coffre:[], forms:[], mdocs:[], vault:{}, vaultOn:false, sanctions:[], inv:[], invlog:[], labs:[], intel:[], ident:[], identLoaded:false, sxLoaded:false, syncErr:false, slow:false, v3:undefined, logs:[], logsOn:false, logsLoaded:false, logsUnsub:null, meta:null});
  clearTimeout(slowT); slowT = setTimeout(() => { if (!Store.synced) { S.slow = true; renderSync(); } }, 10000);
  Store.watchDoc('crew/config', d => { S.config = d; S.cfgLoaded = true; if (checkKick(d)) return; scheduleRender(); });
  Store.watchDoc('crew/v3', d => { S.v3 = !!d; checkSec(); });
  Store.watchDoc('crew/meta', d => { S.meta = d; scheduleRender(); });
  Store.watchColl('members', l => { S.mdocs = l;
    const m = S.mdocs.find(x => x.id === S.meId);
    if (Store.mode === 'fire' && S.meId && l.length && S.myKey) {
      if (!m || m.removed) { logout('removed'); return; }
      if ((m.kv || 0) !== (S.myKey.kv || 0)) { logout('reset'); return; }
    }
    if (isAdmin() && vaultBase() && !S.vaultOn) { S.vaultOn = true; Store.watchColl(vaultBase(), v => { const o = {}; v.forEach(d => { o[d.id] = d; }); S.vault = o; scheduleRender(); }); }
    checkSec(); scheduleRender(); });
  Store.watchColl('ops', l => { S.ops = l; scheduleRender(); });
  Store.watchColl('live', l => { S.live = l; scheduleRender(); });
  Store.watchColl('coffre', l => { S.coffre = l; scheduleRender(); });
  Store.watchColl('formations', l => { S.forms = l; scheduleRender(); });
  Store.watchColl('sanctions', l => { S.sanctions = l; S.sxLoaded = true; identTick(); scheduleRender(); });
  Store.watchColl('ident', l => { S.ident = l; S.identLoaded = true; identTick(); scheduleRender(); });
  Store.watchColl('inv', l => { S.inv = l; scheduleRender(); });
  Store.watchColl('labs', l => { S.labs = l; scheduleRender(); });
  Store.watchColl('intel', l => { S.intel = l; scheduleRender(); });
  Store.watchColl('invlog', l => { S.invlog = l; scheduleRender(); }, {order:'at', dir:'desc', limit:40});
  renderSync(); render();
}
// L'admin connecté avec un ancien code doit faire la mise à jour de sécurité.
function checkSec(){
  if (Store.mode !== 'fire' || S.secOpen || S.v3 !== false || !S.mdocs.length || !isAdmin()) return;
  S.secOpen = true; S.wiz = null; renderSec();
}

Store.init();
(async () => {
  const hash = location.hash;
  const legacy = (hash.match(/^#code=([A-Za-z0-9_-]{16,64})$/) || [])[1];
  const idp = (hash.match(/^#id=(.+)$/) || [])[1];
  S.migrate = hash === '#migration';
  if (legacy) LS.set('crew-code', legacy); // ancien lien d'invitation : retenu pour la migration
  if (idp) { try { S.loginPrefill = decodeURIComponent(idp); } catch(e) {} }
  if (legacy || idp || S.migrate || /^#cle=/.test(hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {} }
  if (Store.mode !== 'fire') { connect(); return; }
  const cle = (hash.match(/^#cle=([A-Za-z0-9-]+)$/) || [])[1];
  const saved = cle ? cle.toUpperCase() : LS.get('crew-key', null);
  if (S.migrate) {
    const crew = LS.get('crew-code', null);
    let secured = true;
    try { secured = !CODE_RE.test(crew || '') || (await Store.db.doc('crews/' + crew + '/crew/meta').get()).exists; } catch(e) {}
    if (!secured) { S.loginOpen = true; renderSync(); render(); renderMigration(); return; }
    S.migrate = false;
  }
  if (saved) {
    S.loginOpen = true; renderSync(); renderLogin('wait');
    try { const k = await Store.getRoot('keys/' + saved); if (k) { await enterWithKey(saved, k); return; } } catch(e) {}
  }
  openLogin();
})();
})();
</script>
